<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Manhaj Ustad</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Georgia,serif;background:linear-gradient(135deg,#0a1a12,#10281c,#143426);min-height:100vh;padding:20px;color:#e8eed8}
.container{max-width:860px;margin:0 auto;background:linear-gradient(160deg,#10281c,#143426);border:1px solid rgba(212,175,55,.28);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
header{background:linear-gradient(135deg,#143426,#1e5f3f);padding:38px 25px 32px;text-align:center;border-bottom:1px solid rgba(212,175,55,.25);position:relative}
header:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:70%;height:2px;background:linear-gradient(90deg,transparent,#d4af37,transparent)}
.moon{font-size:46px;display:block;margin-bottom:10px}
header h1{font-size:25px;color:#f2ecd8;margin-bottom:12px;font-weight:600;line-height:1.3}
header h1 em{color:#d4af37;font-style:normal}
header p{font-size:13.5px;color:#a8bfa8;line-height:1.65}
.content{padding:30px 26px 36px}
.warn-box{background:linear-gradient(135deg,rgba(212,175,55,.1),rgba(212,175,55,.03));border:1px solid rgba(212,175,55,.35);border-radius:12px;padding:15px 18px;font-size:12.5px;line-height:1.7;color:#e6d69a;margin-bottom:22px}
.warn-box strong{color:#d4af37}
.intro{background:linear-gradient(135deg,rgba(76,175,125,.1),rgba(212,175,55,.05));border-left:3px solid #4caf7d;padding:18px 20px;border-radius:10px;font-size:13.5px;line-height:1.75;margin-bottom:24px}
.intro strong{color:#e6c86a}
.progress-wrap{background:#10281c;padding:14px 0 18px;z-index:10;margin-bottom:15px}
.progress-bar-bg{background:rgba(255,255,255,.06);height:8px;border-radius:10px;overflow:hidden;border:1px solid rgba(212,175,55,.15)}
.progress-bar{background:linear-gradient(90deg,#e6c86a,#4caf7d,#1e5f3f);height:100%;width:0;transition:width .4s ease;border-radius:10px}
.progress-text{text-align:center;font-size:12.5px;color:#a8bfa8;margin-top:9px;font-weight:500}

.question-page { display: none; }
.question-page.active { display: block; }

.question{background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.22);border-radius:14px;padding:22px;margin-bottom:12px;position:relative}
.q-cat{display:inline-block;background:linear-gradient(135deg,rgba(30,95,63,.6),rgba(20,52,38,.6));color:#e6c86a;font-size:10.5px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:12px;letter-spacing:1px;text-transform:uppercase;border:1px solid rgba(212,175,55,.3)}
.q-text{font-size:16px;font-weight:600;margin-bottom:8px;line-height:1.5;color:#f2ecd8}
.q-hint{font-size:12.5px;color:#a8bfa8;font-style:italic;margin-bottom:16px;line-height:1.55;padding-left:12px;border-left:2px solid rgba(212,175,55,.3)}
.options{display:flex;flex-direction:column;gap:9px}
.option{display:flex;align-items:flex-start;gap:12px;background:rgba(255,255,255,.03);border:1.5px solid rgba(212,175,55,.15);border-radius:11px;padding:13px 15px;cursor:pointer;transition:all .2s;font-size:14px;line-height:1.5}
.option:hover{border-color:#d4af37;background:rgba(212,175,55,.06);transform:translateX(3px)}
.option input{display:none}
.radio-mark{width:20px;height:20px;min-width:20px;border:2px solid rgba(212,175,55,.4);border-radius:50%;margin-top:1px;position:relative}
.option input:checked+.radio-mark{border-color:#d4af37;background:linear-gradient(135deg,#4caf7d,#1e5f3f)}
.option input:checked+.radio-mark:after{content:"";position:absolute;top:4px;left:4px;width:8px;height:8px;border-radius:50%;background:#e6c86a}
.option input:checked~.opt-label{color:#f2ecd8;font-weight:600}
.option.selected{border-color:#d4af37;background:linear-gradient(135deg,rgba(212,175,55,.08),rgba(76,175,125,.06))}

/* Bar Navigasi persis di bawah soal */
.page-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; gap: 8px; flex-wrap: wrap; }
.page-indicator{font-size:12px;color:#d4af37;font-weight:700;letter-spacing:.5px;text-align:center;flex-basis:100%;order:3;margin-top:8px}
.nav-group-left{display:flex;gap:8px}
.btn-nav-page { padding: 11px 16px; font-size: 13px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; transition: all .2s; font-family: inherit; }
.btn-home { background: rgba(255,193,7,.1); color: #e6c86a; border: 1px solid rgba(212,175,55,.3); }
.btn-home:hover { background: rgba(255,193,7,.2); color: #fff; }
.btn-prev { background: rgba(255,255,255,.06); color: #a8bfa8; border: 1px solid rgba(212,175,55,.22); }
.btn-prev:hover { background: rgba(255,255,255,.1); color: #f2ecd8; }
.btn-next { background: linear-gradient(135deg,#1e5f3f,#4caf7d); color: #fff; box-shadow: 0 4px 15px rgba(30,95,63,.4); }
.btn-next:hover { transform: translateY(-1px); }

.btn-area{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
button{flex:1;min-width:140px;padding:14px 20px;font-size:14px;font-weight:700;border:none;border-radius:12px;cursor:pointer;transition:all .25s;font-family:inherit}
.btn-secondary{background:rgba(255,255,255,.06);color:#a8bfa8;border:1px solid rgba(212,175,55,.22)}
.btn-secondary:hover{background:rgba(255,255,255,.1);color:#f2ecd8}

.share-box{background:rgba(255,255,255,.03);border:1px solid rgba(212,175,55,.2);border-radius:14px;padding:20px;margin-top:20px;text-align:center}
.share-box h3{font-size:15px;color:#f2ecd8;margin-bottom:12px}
.share-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-share{padding:12px 18px;font-size:13px;font-weight:700;border:none;border-radius:10px;cursor:pointer;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn-wa{background:#25d366}
.btn-wa:hover{background:#1ebe5d}
.btn-fb{background:#1877f2}
.btn-fb:hover{background:#1465c0}
.btn-tw{background:#1da1f2}
.btn-tw:hover{background:#1a91da}
.btn-copy{background:#d4af37;color:#0a1a12}
.btn-copy:hover{background:#c29f2e}

#result{display:none}
.result-card{border-radius:18px;padding:34px 26px;text-align:center;margin-bottom:22px;animation:fadeInUp .6s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.grade-1{background:linear-gradient(135deg,rgba(76,175,125,.22),rgba(30,95,63,.1));border:2px solid rgba(76,175,125,.5)}
.grade-2{background:linear-gradient(135deg,rgba(255,193,7,.18),rgba(255,152,0,.1));border:2px solid rgba(255,193,7,.45)}
.grade-3{background:linear-gradient(135deg,rgba(255,111,0,.18),rgba(230,81,0,.1));border:2px solid rgba(255,111,0,.45)}
.grade-4{background:linear-gradient(135deg,rgba(229,57,53,.22),rgba(140,20,20,.1));border:2px solid rgba(229,57,53,.5)}
.grade-badge{display:inline-block;font-size:68px;font-weight:900;line-height:1;margin-bottom:10px;color:#d4af37;font-family:Georgia,serif;text-shadow:0 0 20px rgba(212,175,55,.5)}
.result-title{font-size:24px;font-weight:700;margin-bottom:10px;color:#f2ecd8}
.result-sub{font-size:13.5px;color:#a8bfa8;margin-bottom:18px}
.score-badge{display:inline-block;background:rgba(0,0,0,.35);border:1px solid rgba(212,175,55,.35);padding:8px 22px;border-radius:30px;font-size:16px;font-weight:800;margin-bottom:20px;color:#d4af37}
.result-desc{font-size:14px;line-height:1.75;text-align:left;background:rgba(0,0,0,.3);padding:18px 20px;border-radius:12px;border:1px solid rgba(212,175,55,.15)}
.result-desc ul{margin:10px 0 0 22px}
.result-desc li{margin-bottom:8px}
.result-desc strong{color:#e6c86a}
.result-desc em{color:#4caf7d;font-style:italic}
.breakdown-box{background:rgba(255,255,255,.03);border:1px solid rgba(212,175,55,.15);border-radius:14px;padding:22px;margin-top:20px}
.breakdown-box h3{font-size:17px;color:#f2ecd8;margin-bottom:16px}
.dimensions{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:20px}
.dim-card{background:rgba(255,255,255,.03);border:1px solid rgba(212,175,55,.15);border-radius:12px;padding:16px 18px}
.dim-label{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:#a8bfa8;margin-bottom:6px;font-weight:700}
.dim-value{font-size:22px;font-weight:800;color:#d4af37;margin-bottom:4px}
.dim-bar{height:5px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-top:8px}
.dim-fill{height:100%;border-radius:4px;transition:width .8s ease}
.bd-item{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:6px;background:rgba(255,255,255,.04);gap:10px}
.bd-item.high{background:rgba(229,57,53,.15);border-left:4px solid #ef5350}
.bd-item.mid{background:rgba(255,193,7,.12);border-left:4px solid #ffb300}
.bd-item.low{background:rgba(76,175,125,.12);border-left:4px solid #66bb6a}
.bd-score{font-weight:700;color:#d4af37;min-width:40px;text-align:right}
.solution-item{background:rgba(255,255,255,.03);border-left:3px solid #4caf7d;border-radius:10px;padding:16px 18px;margin-bottom:12px;font-size:13.5px;line-height:1.75}
.solution-item .sol-title{font-weight:700;color:#e6c86a;display:block;margin-bottom:8px
