<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Kesehatan Ginjal Mandiri — Deteksi Dini &amp; Solusi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #06111a;
    --bg-mid: #0f2238;
    --bg-warm: #163250;
    --teal: #5ce1e6;
    --teal-deep: #009688;
    --gold: #e6b980;
    --cream: #f0f7ff;
    --text: #e2e8f0;
    --text-soft: #94a3b8;
    --card: rgba(255,255,255,0.03);
    --card-border: rgba(92,225,230,0.18);
    --card-hover: rgba(92,225,230,0.08);
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:
      radial-gradient(circle at 20% 0%, rgba(0,150,136,0.2) 0%, transparent 45%),
      radial-gradient(circle at 80% 100%, rgba(92,225,230,0.12) 0%, transparent 45%),
      linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-warm) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    padding: 20px;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 840px;
    margin: 0 auto;
    background: linear-gradient(160deg, rgba(15,34,56,0.92), rgba(22,50,80,0.88));
    border: 1px solid rgba(92,225,230,0.22);
    border-radius: 24px;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.6),
      0 0 120px rgba(0,150,136,0.15),
      inset 0 1px 0 rgba(255,255,255,0.05);
    overflow: hidden;
    position: relative;
    z-index: 1;
    backdrop-filter: blur(10px);
  }

  header {
    background: linear-gradient(135deg, rgba(22,50,80,0.9), rgba(30,65,105,0.85));
    padding: 38px 25px 32px;
    text-align: center;
    border-bottom: 1px solid rgba(92,225,230,0.2);
    position: relative;
  }

  /* Tombol Kembali di Pojok Atas */
  .top-nav {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
  }
  .btn-back-top {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(92,225,230,0.3);
    color: var(--cream);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 12.5px;
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .btn-back-top:hover {
    background: rgba(92,225,230,0.2);
    border-color: var(--teal);
  }

  header .icon {
    font-size: 52px;
    display: block;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 20px rgba(92,225,230,0.6));
  }

  header h1 {
    font-size: 27px;
    color: var(--cream);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    font-weight: 700;
  }
  header h1 span { color: var(--teal); }
  header p {
    font-size: 13.5px;
    color: var(--text-soft);
    line-height: 1.6;
  }

  .content { padding: 30px 26px; }

  .intro {
    background: linear-gradient(135deg, rgba(0,150,136,0.12), rgba(92,225,230,0.06));
    border-left: 3px solid var(--teal);
    padding: 18px 20px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 26px;
    color: var(--text);
  }
  .intro strong { color: var(--teal); }

  .progress-wrap {
    position: sticky; top: 0;
    background: linear-gradient(180deg, rgba(15,34,56,0.98), rgba(15,34,56,0.85) 80%, transparent);
    padding: 14px 0 18px;
    z-index: 10;
    margin-bottom: 10px;
    backdrop-filter: blur(6px);
  }
  .progress-bar-bg {
    background: rgba(255,255,255,0.06);
    height: 8px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(92,225,230,0.1);
  }
  .progress-bar {
    background: linear-gradient(90deg, var(--teal), var(--teal-deep));
    height: 100%; width: 0%;
    transition: width 0.4s ease;
    border-radius: 10px;
    box-shadow: 0 0 12px rgba(92,225,230,0.6);
  }
  .progress-text {
    text-align: center;
    font-size: 12.5px;
    color: var(--text-soft);
    margin-top: 9px;
    font-weight: 500;
  }

  .question {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .question:hover { border-color: rgba(92,225,230,0.35); background: var(--card-hover); }
  .question.answered { border-color: rgba(92,225,230,0.5); background: rgba(92,225,230,0.05); }

  .q-cat {
    display: inline-block;
    background: linear-gradient(135deg, rgba(0,150,136,0.35), rgba(15,34,56,0.35));
    color: var(--teal);
    font-size: 10.5px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: 1px solid rgba(92,225,230,0.25);
  }

  .q-text {
    font-size: 16.5px;
    font-weight: 600;
    margin-bottom: 8px;
    line-height: 1.5;
    color: var(--cream);
  }

  .q-hint {
    font-size: 12.5px;
    color: var(--text-soft);
    font-style: italic;
    margin-bottom: 16px;
    line-height: 1.55;
    padding-left: 12px;
    border-left: 2px solid rgba(92,225,230,0.3);
  }

  .options { display: flex; flex-direction: column; gap: 9px; }

  .option {
    display: flex; align-items: flex-start; gap: 12px;
    background: rgba(255,255,255,0.03);
    border: 1.5px solid rgba(92,225,230,0.15);
    border-radius: 12px;
    padding: 13px 15px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 14px;
    line-height: 1.45;
    color: var(--text);
  }
  .option:hover {
    border-color: var(--teal);
    background: rgba(92,225,230,0.08);
    transform: translateX(3px);
  }
  .option input { display: none; }
  .radio-mark {
    width: 20px; height: 20px; min-width: 20px;
    border: 2px solid rgba(92,225,230,0.4);
    border-radius: 50%;
    margin-top: 1px;
    position: relative;
    transition: all 0.2s;
  }
  .option input:checked + .radio-mark {
    border-color: var(--teal);
    background: linear-gradient(135deg, var(--teal), var(--teal-deep));
    box-shadow: 0 0 15px rgba(92,225,230,0.7);
  }
  .option input:checked + .radio-mark::after {
    content: ''; position: absolute;
    top: 4px; left: 4px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--bg-deep);
  }
  .option input:checked ~ .opt-label { color: var(--cream); font-weight: 600; }

  .btn-area { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }

  button, .btn-link-action {
    flex: 1;
    min-width: 150px;
    padding: 16px 22px;
    font-size: 15.5px;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.25s ease;
    letter-spacing: 0.3px;
    text-align: center;
    text-decoration: none;
    display: inline-flex;
    justify-content: center;
    align-items: center;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--teal-deep), var(--teal));
    color: var(--bg-deep);
    box-shadow: 0 8px 30px rgba(0,150,136,0.4);
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0,150,136,0.55);
  }
  .btn-primary:disabled {
    background: rgba(255,255,255,0.08);
    box-shadow: none;
    cursor: not-allowed;
    color: rgba(255,255,255,0.3);
  }

  .btn-secondary {
    background: rgba(255,255,255,0.06);
    color: var(--text-soft);
    border: 1px solid rgba(92,225,230,0.2);
  }
  .btn-secondary:hover { background: rgba(92,225,230,0.1); color: var(--cream); }

  .btn-accent {
    background: linear-gradient(135deg, #2563eb, #1d4ed
